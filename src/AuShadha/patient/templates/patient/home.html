{% extends "base/base.html" %}

{% block title %}Patients - AuShadha EMR{% endblock %}

{% block content %}
<div x-data="{
    showAddForm: false,
    searchQuery: '',
    selectedPatient: null
}">
    <!-- Page Header -->
    <div class="mb-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Patients</h1>
                <p class="mt-1 text-sm text-gray-500">Manage patient records and information</p>
            </div>
            <button @click="showAddForm = true"
                    class="btn btn-primary inline-flex items-center">
                <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Add New Patient
            </button>
        </div>
    </div>

    <!-- Search and Filters -->
    <div class="card mb-6">
        <div class="flex gap-4 items-center">
            <!-- Search Input with HTMX -->
            <div class="flex-1">
                <label for="search" class="sr-only">Search patients</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text"
                           id="search"
                           name="search"
                           x-model="searchQuery"
                           hx-get="{% url 'patient:patient_list' %}"
                           hx-trigger="keyup changed delay:500ms"
                           hx-target="#patient-list"
                           hx-include="[name='search']"
                           class="form-input pl-10"
                           placeholder="Search by name, hospital ID, or phone...">
                </div>
            </div>

            <!-- Filter Dropdowns (Alpine.js) -->
            <div x-data="{ filterOpen: false }" class="relative">
                <button @click="filterOpen = !filterOpen"
                        class="btn btn-secondary inline-flex items-center">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    Filters
                </button>

                <!-- Dropdown -->
                <div x-show="filterOpen"
                     @click.away="filterOpen = false"
                     x-transition
                     class="absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-10"
                     style="display: none;">
                    <div class="py-1">
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">All Patients</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Recent</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Favorites</a>
                    </div>
                </div>
            </div>

            <!-- Refresh Button (HTMX) -->
            <button hx-get="{% url 'patient:patient_list' %}"
                    hx-target="#patient-list"
                    class="btn btn-secondary">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Patient List (HTMX loaded) -->
    <div id="patient-list"
         hx-get="{% url 'patient:patient_list' %}"
         hx-trigger="load"
         hx-indicator="#global-spinner">
        <!-- Patient list will be loaded here via HTMX -->
        <div class="text-center py-12">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-2 text-gray-500">Loading patients...</p>
        </div>
    </div>

    <!-- Add Patient Modal (Alpine.js + HTMX) -->
    <div x-show="showAddForm"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed z-50 inset-0 overflow-y-auto"
         style="display: none;">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <!-- Background overlay -->
            <div class="fixed inset-0 transition-opacity" @click="showAddForm = false">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>

            <!-- Modal content -->
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium text-gray-900">Add New Patient</h3>
                        <button @click="showAddForm = false" class="text-gray-400 hover:text-gray-500">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Form loaded via HTMX -->
                    <div hx-get="{% url 'patient:patient_add' %}"
                         hx-trigger="load"
                         hx-swap="innerHTML">
                        Loading form...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Listen for successful patient addition
    document.body.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'patient-form-container') {
            // Check if response indicates success
            const response = event.detail.xhr.response;
            if (response.includes('success')) {
                // Close modal
                Alpine.store('showAddForm', false);
                // Refresh patient list
                htmx.trigger('#patient-list', 'refresh');
            }
        }
    });
</script>
{% endblock %}
