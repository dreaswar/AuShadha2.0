<!-- Reusable Dialog Component -->
<div x-data="dialog()" x-cloak>
    <!-- Dialog Overlay -->
    <div x-show="isOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="closeDialog"
         @keydown.escape.window="closeDialog"
         class="dialog-overlay"
         style="display: none;"
         :style="{ display: isOpen ? 'flex' : 'none' }">

        <!-- Dialog Container -->
        <div @click.stop
             x-show="isOpen"
             x-transition:enter="transition ease-out duration-200 transform"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-150 transform"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95"
             class="dialog-container"
             :style="{ width: dialogWidth, maxWidth: '95vw' }">

            <!-- Dialog Header -->
            <div class="dialog-header">
                <h3 class="dialog-title" x-text="dialogTitle"></h3>
                <button @click="closeDialog" class="btn-icon" type="button" aria-label="Close dialog">
                    <span style="font-size: 24px; line-height: 1;">&times;</span>
                </button>
            </div>

            <!-- Dialog Body -->
            <div class="dialog-body" id="dialog-content" x-html="dialogContent"></div>

            <!-- Dialog Footer (optional) -->
            <div class="dialog-footer" x-show="showFooter">
                <button @click="closeDialog" class="btn btn-secondary" type="button">
                    Cancel
                </button>
                <button @click="handlePrimaryAction"
                        class="btn btn-primary"
                        type="button"
                        x-show="primaryAction"
                        x-text="primaryActionLabel"></button>
            </div>
        </div>
    </div>
</div>

<style>
    [x-cloak] { display: none !important; }

    .dialog-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: var(--claro-spacing-4);
    }

    .dialog-container {
        background: var(--claro-bg-content);
        border-radius: var(--claro-border-radius-lg);
        box-shadow: var(--claro-shadow-lg);
        display: flex;
        flex-direction: column;
        max-height: 90vh;
        border: var(--claro-border-width) solid var(--claro-border-color);
    }

    .dialog-header {
        padding: var(--claro-spacing-4);
        border-bottom: var(--claro-border-width) solid var(--claro-border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--claro-gradient-button);
        border-top-left-radius: var(--claro-border-radius-lg);
        border-top-right-radius: var(--claro-border-radius-lg);
    }

    .dialog-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--claro-text-primary);
    }

    .dialog-body {
        padding: var(--claro-spacing-4);
        overflow-y: auto;
        flex: 1;
    }

    .dialog-footer {
        padding: var(--claro-spacing-4);
        border-top: var(--claro-border-width) solid var(--claro-border-color);
        display: flex;
        justify-content: flex-end;
        gap: var(--claro-spacing-2);
        background: var(--claro-bg-panel);
        border-bottom-left-radius: var(--claro-border-radius-lg);
        border-bottom-right-radius: var(--claro-border-radius-lg);
    }

    /* Prevent body scroll when dialog is open */
    body.dialog-open {
        overflow: hidden;
    }
</style>

<script>
    function dialog() {
        return {
            isOpen: false,
            dialogTitle: '',
            dialogContent: '',
            dialogWidth: '600px',
            showFooter: false,
            primaryAction: null,
            primaryActionLabel: 'Save',

            openDialog(options) {
                this.dialogTitle = options.title || 'Dialog';
                this.dialogContent = options.content || '';
                this.dialogWidth = options.width || '600px';
                this.showFooter = options.showFooter !== undefined ? options.showFooter : false;
                this.primaryAction = options.primaryAction || null;
                this.primaryActionLabel = options.primaryActionLabel || 'Save';

                this.isOpen = true;
                document.body.classList.add('dialog-open');

                // If content is a URL, fetch it
                if (options.url) {
                    this.loadContent(options.url);
                }

                // Set up HTMX event listeners for forms inside dialog
                this.$nextTick(() => {
                    this.setupFormHandlers();
                });
            },

            closeDialog() {
                this.isOpen = false;
                document.body.classList.remove('dialog-open');

                // Clear content after animation
                setTimeout(() => {
                    this.dialogContent = '';
                }, 200);
            },

            async loadContent(url) {
                try {
                    const response = await fetch(url, {
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'HX-Request': 'true'
                        }
                    });

                    if (response.ok) {
                        this.dialogContent = await response.text();
                        this.$nextTick(() => {
                            this.setupFormHandlers();
                            // Initialize HTMX on the new content
                            if (window.htmx) {
                                htmx.process(document.getElementById('dialog-content'));
                            }
                        });
                    } else {
                        this.dialogContent = '<div class="alert alert-error">Failed to load content</div>';
                    }
                } catch (error) {
                    console.error('Dialog load error:', error);
                    this.dialogContent = '<div class="alert alert-error">Error loading content</div>';
                }
            },

            setupFormHandlers() {
                const dialogBody = document.getElementById('dialog-content');
                if (!dialogBody) return;

                // Handle form submissions
                const forms = dialogBody.querySelectorAll('form');
                forms.forEach(form => {
                    form.addEventListener('htmx:afterRequest', (event) => {
                        if (event.detail.successful) {
                            // Check if it's a create/update operation (status 200 or 201)
                            if (event.detail.xhr.status === 200 || event.detail.xhr.status === 201) {
                                // Dispatch custom event that pages can listen to
                                window.dispatchEvent(new CustomEvent('dialog:success', {
                                    detail: {
                                        form: form,
                                        response: event.detail.xhr.responseText
                                    }
                                }));

                                // Close dialog after successful submission
                                this.closeDialog();
                            }
                        }
                    });
                });

                // Handle cancel buttons
                const cancelButtons = dialogBody.querySelectorAll('[data-dialog-close]');
                cancelButtons.forEach(btn => {
                    btn.addEventListener('click', () => this.closeDialog());
                });
            },

            handlePrimaryAction() {
                if (typeof this.primaryAction === 'function') {
                    this.primaryAction();
                }
            }
        };
    }

    // Global function to open dialog from anywhere
    window.openDialog = function(options) {
        // Find the dialog component and call openDialog
        const dialogEl = document.querySelector('[x-data*="dialog()"]');
        if (dialogEl && dialogEl.__x) {
            dialogEl.__x.$data.openDialog(options);
        }
    };
</script>
